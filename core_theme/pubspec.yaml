name: core_theme
description: Design tokens — colors, typography, spacing, and theme configuration. One truth.
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: MonaSans
      fonts:
        - asset: fonts/MonaSans-Regular.ttf
          weight: 400
        - asset: fonts/MonaSans-Medium.ttf
          weight: 500
        - asset: fonts/MonaSans-SemiBold.ttf
          weight: 600
        - asset: fonts/MonaSans-Bold.ttf
          weight: 700
    - family: MonaSansDisplay
      fonts:
        - asset: fonts/MonaSansDisplay-Regular.ttf
          weight: 400
        - asset: fonts/MonaSansDisplay-Medium.ttf
          weight: 500
        - asset: fonts/MonaSansDisplay-SemiBold.ttf
          weight: 600
        - asset: fonts/MonaSansDisplay-Bold.ttf
          weight: 700
    - family: MonaSansMono
      fonts:
        - asset: fonts/MonaSansMono-Regular.ttf
          weight: 400
        - asset: fonts/MonaSansMono-Medium.ttf
          weight: 500
        - asset: fonts/MonaSansMono-SemiBold.ttf
          weight: 600
